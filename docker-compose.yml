# 加固版 docker-compose.yml
# 配套 .env 使用，密码全部从环境变量读取
version: '3.4'

services:
  new-api:
    image: newapi-hardened:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "0.0.0.0:3000:3000"     # 测试阶段开放到本机局域网；生产建议改回 127.0.0.1 并走前置 nginx/caddy
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://newapi:${DB_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - SERVER_ADDRESS=${SERVER_ADDRESS}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=false
      - NODE_NAME=${NODE_NAME:-newapi-node-1}
      - DEBUG=false
      - ENABLE_PPROF=false
      - GLOBAL_WEB_RATE_LIMIT=600
      - GLOBAL_WEB_RATE_LIMIT_DURATION=60
      # P0 D1/D2 prompt 资产化归档开关 — 默认 false，需要在 .env 显式设 true 才生效
      - PROMPT_ARCHIVE_ENABLED=${PROMPT_ARCHIVE_ENABLED:-false}
      - PROMPT_ARCHIVE_RETENTION_DAYS=${PROMPT_ARCHIVE_RETENTION_DAYS:-90}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  new-api-network:
    driver: bridge

volumes:
  pg_data:
